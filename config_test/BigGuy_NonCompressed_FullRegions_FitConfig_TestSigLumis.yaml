#main fit
#ABCD - SR bin (D) maps to [C, A, B]
#grid convention
#not bh    C(7) | D(8)
#        ---------
#bh        B(5) | A(6)
#      early -> late
# such that D/A = C/B -> D = C*A/B 
ABCD_fit:
  bin_association:
    Ch5CRgeq1PhoBHEarlyBin:
      - "Ch5CRgeq1PhoBHEarlyBin00"
      - "Ch5CRgeq1PhoBHEarlyBin10"
      - "Ch5CRgeq1PhoBHEarlyBin01"
      - "Ch5CRgeq1PhoBHEarlyBin11"
    Ch6CRgeq1PhoBHLateBin:
      - "Ch6CRgeq1PhoBHLateBin00"
      - "Ch6CRgeq1PhoBHLateBin10"
      - "Ch6CRgeq1PhoBHLateBin01"
      - "Ch6CRgeq1PhoBHLateBin11"
    Ch7CRgeq1PhoNotBHEarlyBin:
      - "Ch7CRgeq1PhoNotBHEarlyBin00"
      - "Ch7CRgeq1PhoNotBHEarlyBin10"
      - "Ch7CRgeq1PhoNotBHEarlyBin01"
      - "Ch7CRgeq1PhoNotBHEarlyBin11"
    Ch15CRgeq1PhoMedIsoEarly:
      - "Ch15CRgeq1PhoMedIsoEarly00"
      - "Ch15CRgeq1PhoMedIsoEarly10"
      - "Ch15CRgeq1PhoMedIsoEarly01"
      - "Ch15CRgeq1PhoMedIsoEarly11"
    Ch16CRgeq1PhoMedIsoLate:
      - "Ch16CRgeq1PhoMedIsoLate00"
      - "Ch16CRgeq1PhoMedIsoLate10"
      - "Ch16CRgeq1PhoMedIsoLate01"
      - "Ch16CRgeq1PhoMedIsoLate11"
    Ch17CRgeq1PhoTightIsoEarly: 
      - "Ch17CRgeq1PhoTightIsoEarly00"
      - "Ch17CRgeq1PhoTightIsoEarly10"
      - "Ch17CRgeq1PhoTightIsoEarly01"
      - "Ch17CRgeq1PhoTightIsoEarly11"
    Ch8SRgeq1PhoNotBHLateBin:
      - "Ch8SRgeq1PhoNotBHLateBin00"
      - "Ch8SRgeq1PhoNotBHLateBin10"
      - "Ch8SRgeq1PhoNotBHLateBin01"
      - "Ch8SRgeq1PhoNotBHLateBin11"
  channel_association:
    Ch8SRgeq1PhoNotBHLateBin:
      bkgbh:
        - "Ch6CRgeq1PhoBHLateBin"
        - "Ch7CRgeq1PhoNotBHEarlyBin"
        - "Ch5CRgeq1PhoBHEarlyBin"
      bkgprompt:
        - "Ch16CRgeq1PhoMedIsoLate"
        - "Ch17CRgeq1PhoTightIsoEarly"
        - "Ch15CRgeq1PhoMedIsoEarly"
    #Ch8SRgeq1PhoNotBHLateTightIso:
    #  bkgbh:
    #    - "Ch6CRgeq1PhoBHLate"
    #    - "Ch7CRgeq1PhoNotBHEarly"
    #    - "Ch5CRgeq1PhoBHEarly"
      #bkgprompt:
      #  - "Ch16CRgeq1PhoMedIsoLate"
      #  - "Ch17CRgeq1PhoTightIsoEarly"
      #  - "Ch15CRgeq1PhoMedIsoEarly"
  # Prompt bkg leaking into the notBH early CR, templated bin-by-bin from the tight-iso early CR.
  # transfer_factor: auto = min over bins of yield(target)/yield(source), or give a number.
  template_processes:
    - source_channel: "Ch17CRgeq1PhoTightIsoEarly"
      target_channel: "Ch7CRgeq1PhoNotBHEarlyBin"
      process: "bkgprompt"
      transfer_factor: auto
